<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiration Wall | Plate.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/opposans" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/wall.css">
  <style>
    .page-mask {
      position: fixed; inset: 0; background: #002FA7; z-index: 10000;
      transform-origin: top; transform: scaleY(1); display: flex;
      justify-content: center; align-items: center; pointer-events: all;
    }
  </style>
</head>
<body>
  <div class="page-mask"><div class="transition-logo"></div></div>

  <nav id="navbar">
    <div class="logo">Plate<span class="dot">.</span></div>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/index.html#articles">Writings</a>
      <a href="/photography.html">Photography</a>
      <a href="/fragments.html">Fragments</a>
      <a href="/about.html">About</a>
    </div>
  </nav>

  <div id="wall-status" class="wall-status"></div>

  <div id="wall-canvas" class="wall-canvas" role="application" aria-label="灵感墙画布">
    <div class="wall-world" id="wall-world"></div>
  </div>

  <!-- New card dialog (admin only) -->
  <div id="wall-dialog" class="wall-dialog" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="wall-dialog-title">
    <div class="wall-dialog-card glass-card">
      <h3 id="wall-dialog-title">New Card</h3>
      <div class="wall-dialog-type">
        <button class="wall-type-btn active" data-type="text" aria-pressed="true">Text</button>
        <button class="wall-type-btn" data-type="quote" aria-pressed="false">Quote</button>
        <button class="wall-type-btn" data-type="code" aria-pressed="false">Code</button>
        <button class="wall-type-btn" data-type="image" aria-pressed="false">Image</button>
      </div>
      <div class="wall-dialog-color">
        <button class="wall-color-btn active" data-color="blue" style="background:rgba(0,47,167,0.3);" aria-label="蓝色卡片" aria-pressed="true"></button>
        <button class="wall-color-btn" data-color="yellow" style="background:rgba(255,189,46,0.4);" aria-label="黄色卡片" aria-pressed="false"></button>
        <button class="wall-color-btn" data-color="white" style="background:rgba(255,255,255,0.7);" aria-label="白色卡片" aria-pressed="false"></button>
        <button class="wall-color-btn" data-color="dark" style="background:#0f172a;" aria-label="深色卡片" aria-pressed="false"></button>
      </div>
      <textarea id="wall-dialog-content" rows="4" placeholder="Write something..." aria-label="灵感卡片内容"></textarea>
      <div class="wall-dialog-actions">
        <button id="wall-dialog-cancel" class="articles-tool-link">Cancel</button>
        <button id="wall-dialog-create" class="articles-tool-link" style="background:var(--primary-color);color:#fff;">Create</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Plate. Powered by Algorithm & Aesthetics.</p>
  </footer>

  <script type="module" src="./assets/js/main.js"></script>
  <script type="module" src="./assets/js/wall.js"></script>
  <script type="module" src="./assets/js/transition.js"></script>
</body>
</html>
