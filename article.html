<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plate. 技术博客文章详情，聚焦算法、美学、LLM、安全与前端工程。">
    <meta property="og:title" content="Article | Plate.">
    <meta property="og:description" content="Plate. 技术博客文章详情。">
    <meta property="og:type" content="article">
    <title>Article | Plate.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/opposans" rel="stylesheet">
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- Article Specific Styles -->
    <link rel="stylesheet" href="./assets/css/article.css">
    
    <!-- Highlight.js Theme (One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <!-- GSAP Core & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        .page-mask {
            position: fixed; inset: 0; background: #002FA7; z-index: 10000;
            transform-origin: top; transform: scaleY(1); display: flex;
            justify-content: center; align-items: center; pointer-events: all;
        }
    </style>
</head>
<body>
    <div class="page-mask"><div class="transition-logo"></div></div>
    
    
    <!-- Scroll Progress -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar"></div>
    </div>

    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav id="navbar" class="reveal-element">
        <div class="logo">Plate<span class="dot">.</span></div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/index.html#articles">Writings</a>
            <a href="/photography.html">Photography</a>
            <a href="/about.html">About</a>
        </div>
    </nav>

    <!-- Main Article Container -->
    <main class="article-container">
        <div id="loading-indicator" class="loading-state">
            <div class="spinner"></div>
            <p>Loading Cognitive Core...</p>
        </div>
        
        <article id="markdown-content" class="markdown-body reveal-element" style="display: none;">
            <!-- Markdown content will be injected here -->
        </article>

        <section id="reading-links" class="reading-links" style="display: none;">
            <div id="post-navigation" class="post-navigation"></div>
            <div id="related-posts" class="related-posts"></div>
        </section>

        <!-- CMS Interactions: Likes & Comments -->
        <section id="article-interactions" class="interactions-container" style="display: none;">
            <div class="like-section">
                <button id="btn-like" class="btn-like">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span id="like-count">0</span> Likes
                </button>
            </div>

            <div class="comments-section">
                <h3>Comments (<span id="comment-count">0</span>)</h3>
                
                <div class="comment-form">
                    <input type="text" id="comment-author" placeholder="Your Name">
                    <textarea id="comment-text" rows="3" placeholder="Leave a comment..."></textarea>
                    <button id="btn-submit-comment" class="btn-primary">Post Comment</button>
                </div>

                <div id="comments-list" class="comments-list">
                    <!-- Comments will be injected here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Plate. Powered by Algorithm & Aesthetics.</p>
    </footer>

    <script type="module" src="./assets/js/main.js"></script>
    <script type="module" src="./assets/js/article.js"></script>
    <script type='module' src='./assets/js/transition.js'></script>
</body>
</html>
